# Locate CMake for the vendored whisper.cpp build in build.rs. cc and the VS
# generator resolve cl.exe themselves. If a bindgen-based crate is ever added,
# install LLVM and set LIBCLANG_PATH here.
[env]
CMAKE = "C:/Users/HP/AppData/Local/Programs/cmake/bin/cmake.exe"

# Fully static CRT: the release exe runs on any Windows 10+ 64-bit PC with
# no Visual C++ redistributable installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
